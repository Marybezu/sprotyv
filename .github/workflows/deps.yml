name: Refresh dependency checksums

# Run by hand (or by pushing the deps-refresh branch) after changing dependencies.
# Writes gradle/verification-metadata.xml to the deps-metadata branch for review;
# it is copied into main only after a person or the assistant has looked at it.
on:
  workflow_dispatch:
  push:
    branches: [deps-refresh]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      # Gradle itself is checked against a fixed checksum before it runs
      - name: Install Gradle (checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          V=8.14.3
          SHA=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$V-bin.zip"
          echo "$SHA  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$V/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Built-in maps (checked against maps.lock)
        run: bash scripts/maps/fetch.sh
      - name: Write checksums
        shell: bash
        run: |
          rm -f gradle/verification-metadata.xml
          # Failing tests must not stop the checksums from being written; the log shows why
          gradle --no-daemon --continue --write-verification-metadata sha256 testReleaseUnitTest assembleRelease > deps.log 2>&1 || true
          mkdir -p meta
          cp gradle/verification-metadata.xml meta/ 2>/dev/null || echo "no metadata written" > meta/MISSING
          # Which network classes are left in the built APK (should be none)
          { unzip -o -q app/build/outputs/apk/release/app-release-unsigned.apk 'classes*.dex' -d dex && { grep -a -o -h -E 'Lorg/mapsforge/map/layer/download/[A-Za-z/]*|Ljava/net/[A-Za-z]*;|Ljavax/net/ssl/[A-Za-z]*;|Landroid/net/http/[A-Za-z]*;' dex/classes*.dex || true; } | sort | uniq -c > meta/network-classes.txt; echo "checked" >> meta/network-classes.txt; } 2>/dev/null || echo "no apk" > meta/network-classes.txt
          # The screens drawn by the tests, for review of type and layout (neutral test data only)
          cp -r app/build/screens meta/screens 2>/dev/null || true
          # (no matches is fine: grep would otherwise stop the step under pipefail)
          { grep -E "^e: |FAILED|What went wrong|Exception" -A5 deps.log | head -200 || true; echo ----; tail -80 deps.log; } > meta/deps.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-metadata
          path: meta/

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verification-metadata
          path: out
      - name: Push for review
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q && git checkout -q -b deps-metadata && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "verification metadata ${{ github.run_number }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" deps-metadata
