name: Rules of the Road text

# Fetches the current official text of the Rules of the Road (Cabinet resolution No. 1306) from
# zakon.rada.gov.ua and turns it into content/src/main/assets/pdr.json for review. Run by hand or
# by pushing the pdr-fetch branch. An official document: not protected by copyright (law No. 2811-IX, art. 8).
on:
  workflow_dispatch:
  push:
    branches: [pdr-fetch]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Fetch and convert
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36" \
            -o pdr.html "https://zakon.rada.gov.ua/laws/show/1306-2001-%D0%BF/print"
          ls -la pdr.html
          python3 scripts/content/pdr.py pdr.html pdr.json
          ls -la pdr.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdr
          path: |
            pdr.json
            pdr.html
          retention-days: 7
