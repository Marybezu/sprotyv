name: Build maps

# Builds the light overview map of all Ukraine from OpenStreetMap (built into the app at build
# time, checked against maps.lock). Run by hand, or by pushing the maps-build branch. Publishes it
# as a release with its SHA-256 sum. No app code runs here.
on:
  workflow_dispatch:
  push:
    branches: [maps-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Read by every Java start, whatever the launcher script does (the JVM says "Picked up" in the log)
      JAVA_TOOL_OPTIONS: -Xmx13g
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Tools (osmium, osmosis, the Mapsforge writer)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool osmosis
          osmosis -v 2>&1 | head -3 || true
          mkdir -p ~/.openstreetmap/osmosis/plugins
          J=mapsforge-map-writer-0.25.0-jar-with-dependencies.jar
          U=https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.25.0
          curl -sSfL -o "$J" "$U/$J"
          # A fixed SHA-256, written here: not one fetched from the same server as the file
          echo "c132d97d492707b30f2bf0c594ce9009eac9a8bde4e6be8ad97a005a506f4b68  $J" | sha256sum -c -
          mv "$J" ~/.openstreetmap/osmosis/plugins/

      - name: OpenStreetMap data for Ukraine (checked against its MD5)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          curl -sSfL -o ukraine.osm.pbf https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
          curl -sSfL -o ukraine.md5 https://download.geofabrik.de/europe/ukraine-latest.osm.pbf.md5
          echo "$(cut -d' ' -f1 ukraine.md5)  ukraine.osm.pbf" | md5sum -c -
          osmium fileinfo -e ukraine.osm.pbf | grep -E "Timestamp|Number of" | head -8 || true
          ls -la

      - name: Overview of all Ukraine (built into the app)
        shell: bash
        run: |
          set -euo pipefail
          cd work
          mkdir -p out
          # Only what helps to find one's way: settlements, main roads, rail, rivers, big water, boundaries
          osmium tags-filter ukraine.osm.pbf \
            n/place=city,town,village \
            w/highway=motorway,trunk,primary,motorway_link,trunk_link \
            w/railway=rail w/waterway=river r/natural=water \
            r/admin_level=2,4 \
            -o overview.osm.pbf --overwrite
          osmosis -q --rbf file=overview.osm.pbf --mapfile-writer file=out/overview.map type=hd threads=4 \
            preferred-languages=uk,en zoom-interval-conf=5,0,7,9,8,11 simplification-factor=5
          ls -la out

      - name: Sums and sizes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd work/out
          sha256sum *.map > SHA256SUMS || true
          du -h *.map | sort -h
          du -ch *.map | tail -1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: maps
          path: work/out/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: maps
          path: out
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="maps-$(date -u +%Y%m%d)-${{ github.run_number }}"
          gh release create "$tag" out/* --repo "${{ github.repository }}" --title "Мапи $(date -u +%d.%m.%Y)" \
            --notes "Офлайн-мапи з OpenStreetMap (© учасники OpenStreetMap, ODbL). Оглядова мапа України, вшивається в застосунок. Суми SHA-256 — у SHA256SUMS." --prerelease
