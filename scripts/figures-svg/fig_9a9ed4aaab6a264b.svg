  <text x="20" y="24" font-family="DejaVu Sans" font-size="11" fill="#333">Руки прямі в ліктях,</text>
  <text x="20" y="40" font-family="DejaVu Sans" font-size="11" fill="#333">тиснути вагою тіла.</text>
  <text x="20" y="56" font-family="DejaVu Sans" font-size="11" fill="#333">Точка — центр грудей</text>
  <text x="20" y="72" font-family="DejaVu Sans" font-size="11" fill="#333">(нижня половина грудини)</text>
  <text x="290" y="40" font-family="DejaVu Sans" font-size="12" fill="#b0121a" font-weight="bold">Глибина 5–6 см</text>
  <text x="290" y="58" font-family="DejaVu Sans" font-size="12" fill="#b0121a" font-weight="bold">Темп 100–120/хв</text>
  <text x="290" y="76" font-family="DejaVu Sans" font-size="11" fill="#333">30 натискань : 2 вдихи</text>
